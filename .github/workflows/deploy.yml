name: Deploy O-Wallet to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve dependency lock if repository does not include one
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::warning::package-lock.json is not committed; resolving transitive dependencies for this run."
            npm install --package-lock-only --include=optional --ignore-scripts --no-audit --no-fund
          fi

      - name: Install dependencies without lifecycle scripts
        run: npm ci --include=optional --ignore-scripts --no-audit --no-fund

      - name: Security source checks
        run: npm run security:check

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}

      - name: Security checks on built artifact
        run: npm run security:dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
      actions: read
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
