name: OCR Visual E2E

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/ocr.ts'
      - 'src/lib/ocrParsing.ts'
      - 'src/lib/ocrHeuristics.ts'
      - 'src/lib/ocrCheckpoint.ts'
      - 'src/ocrVisualE2E.ts'
      - 'src/main.tsx'
      - 'scripts/ocr-visual-e2e.mjs'
      - 'package.json'
      - '.github/workflows/ocr-visual-e2e.yml'
  workflow_dispatch:

concurrency:
  group: ocr-visual-e2e
  cancel-in-progress: true

jobs:
  visual-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve dependency lock if repository does not include one
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --include=optional --ignore-scripts --no-audit --no-fund
          fi

      - name: Install dependencies
        run: npm ci --include=optional --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Cache English OCR language data locally
        shell: bash
        run: |
          mkdir -p public/tessdata
          curl -fsSL --retry 3 --retry-delay 2 https://tessdata.projectnaptha.com/4.0.0/eng.traineddata.gz -o public/tessdata/eng.traineddata.gz

      - name: Build OCR visual harness
        run: npm run build
        env:
          VITE_OCR_E2E: '1'

      - name: Run synthetic visual OCR E2E
        run: npm run test:ocr:visual

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-visual-e2e-failure
          if-no-files-found: ignore
          path: |
            ocr-visual-e2e-failure.png
            ocr-visual-e2e-result.json
